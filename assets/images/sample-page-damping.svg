<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620"><rect width="680" height="620" rx="18" fill="#f5f1e8"/><text x="60" y="82" fill="#111827" font-family="Arial" font-size="34" font-weight="800">Damping Theory</text><rect x="60" y="118" width="560" height="12" fill="#f3b331"/><text x="60" y="172" fill="#334155" font-family="Arial" font-size="23">Low-speed damping controls chassis attitude.</text><text x="60" y="214" fill="#334155" font-family="Arial" font-size="23">High-speed damping controls impact response.</text><rect x="60" y="260" width="560" height="270" rx="14" fill="#ffffff" stroke="#d2d8e3"/><path d="M105 480 C190 445 250 395 320 340 S455 275 570 235" fill="none" stroke="#111827" stroke-width="8" stroke-linecap="round"/><line x1="105" y1="495" x2="585" y2="495" stroke="#64748b" stroke-width="3"/><line x1="105" y1="495" x2="105" y2="225" stroke="#64748b" stroke-width="3"/><text x="130" y="565" fill="#334155" font-family="Arial" font-size="21">Curve shape changes with bleed, stack stiffness and velocity.</text></svg>